<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketKey - Fremont TFF Permit Wizard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-xl w-full bg-white shadow-lg rounded-2xl p-8 border border-slate-100">
        <h1 class="text-2xl font-bold text-slate-900 mb-2">MarketKey Test Portal</h1>
        <p class="text-slate-600 mb-6">Enter your business name below to test the client-side PDF generator.</p>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Business Name</label>
                <input type="text" id="businessNameInput" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="e.g., Fremont Tamale House">
            </div>

            <button id="generateBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors shadow-sm">
                Generate & Download PDF
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
